name: mmhand
channels:
  - conda-forge
  - robostack-jazzy
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26
  - ros-jazzy-ros-base
  - ros-jazzy-std-msgs
  - ros-jazzy-rmw-cyclonedds-cpp
  - viser=1.0.30
  - yourdfpy=0.0.60
  - opencv=5.0
  - scipy=1.14
  - pip
  - pip:
      - --index-url=https://pypi.tuna.tsinghua.edu.cn/simple
      - pyrealsense2==2.58.3.10794
variables:
  PYTHONNOUSERSITE: "1"
  MPLCONFIGDIR: /tmp/mvhc-matplotlib
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
