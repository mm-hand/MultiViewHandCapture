name: mmhand
channels:
  - conda-forge
  - robostack-jazzy
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26
  - absl-py>=2.3,<3
  - certifi
  - flatbuffers>=25.9,<26
  - matplotlib
  - python-sounddevice>=0.5,<0.6
  - ros-jazzy-ros-base
  - ros-jazzy-std-msgs
  - ros-jazzy-rmw-cyclonedds-cpp
  - viser=1.0.30
  - yourdfpy=0.0.60
  - opencv=5.0
  - scipy=1.14
  - git-lfs
  - pip
  - pip:
      - --index-url=https://pypi.tuna.tsinghua.edu.cn/simple
      - --no-deps
variables:
  PYTHONNOUSERSITE: "1"
  MPLCONFIGDIR: /tmp/mmhand-teleop-matplotlib
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
